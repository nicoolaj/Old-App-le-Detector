name: Security and best practices

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "Makefile"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "Makefile"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "0 6 * * 1" # weekly audit for newly-disclosed vulnerabilities
  workflow_dispatch:

jobs:
  audit:
    name: fmt / clippy / cargo audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: make secu (fmt, clippy, cargo audit)
        run: make secu
